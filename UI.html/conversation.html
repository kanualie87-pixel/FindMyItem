<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="conversation.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="topbar">
      <a class="back" id="backLink" href="messages.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1 id="convTitleBar">Conversation</h1>
    </div>
    <div class="subbar" id="convItemSub">Re: item</div>

    <!-- shown only when starting a brand-new conversation -->
    <div class="contact-body hidden" id="composeWrap">
      <form id="contactForm">
        <div class="field"><label>Your Message</label><textarea id="contactMsgInput" placeholder="Type your message here..." required></textarea></div>
        <div class="field"><label>Preferred Contact Method</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg></span>
            <select class="with-icon"><option>Email</option><option>Phone</option></select>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </div>

    <!-- shown once a thread exists (new or seeded) -->
    <div class="chat-body hidden" id="chatBody"></div>
    <div class="chat-inputbar hidden" id="chatInputBar">
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button class="chat-send-btn" id="sendBtn" aria-label="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="conversation.js"></script>
</body>
</html>
