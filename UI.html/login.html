<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="auth-wrap">
      <h1>Login to FindMyItem</h1>
      <p class="sub">Welcome back! Please enter your details.</p>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg></span>
            <input class="with-icon" type="email" id="loginEmail" placeholder="your@example.com" required>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="with-icon" type="password" id="loginPass" placeholder="••••••••" required>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
      <div class="auth-link-row"><a href="#" id="forgotPasswordLink">Forgot password?</a></div>
      <div class="auth-link-row">Don't have an account? <a href="register.html" class="link-brand">Register</a></div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
