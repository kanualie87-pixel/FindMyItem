<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="auth-wrap">
      <h1>Create your account</h1>
      <p class="sub">Join FindMyItem to track your lost belongings.</p>
      <form id="registerForm">
        <div class="field" id="f-reg-name"><label>Name</label><input type="text" id="regName" placeholder="Abubakarr Sow" required></div>
        <div class="field" id="f-reg-email"><label>Email</label><input type="email" id="regEmail" placeholder="abubakarr.sow@example.com" required></div>
        <div class="field" id="f-reg-pass"><label>Password</label><input type="password" id="regPass" placeholder="abubakarr@2000" required></div>
        <div class="field" id="f-reg-confirm"><label>Confirm Password</label><input type="password" id="regConfirm" placeholder="abubakarr@2000" required>
          <div class="error-text">Passwords do not match</div>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
      <div class="auth-foot">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
