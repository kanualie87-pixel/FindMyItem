<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Lost Item — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="report-lost.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="topbar">
      <a class="back" href="../home/home.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1>Report Lost Item</h1>
    </div>
    <div class="form-body">
      <form id="reportForm">
        <div class="field" id="f-item-name"><label>Item Name</label><input type="text" id="itemNameInput" placeholder="e.g., iPhone 15, Blue Backpack" required>
          <div class="error-text">Please enter the item's name</div>
        </div>
        <div class="field" id="f-item-desc"><label>Description</label><textarea id="itemDescInput" placeholder="Describe the item (color, size, unique marks, approximate location lost)..." required></textarea>
          <div class="error-text">Please add a short description</div>
        </div>
        <div class="field">
          <label>Upload Image</label>
          <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept="image/png,image/jpeg" class="visually-hidden-input">
            <div class="cloud"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18a4 4 0 0 1-1-7.87A5 5 0 0 1 15 6a4.5 4.5 0 0 1 1 8.9"/><polyline points="12 12 12 18"/><polyline points="9 15 12 12 15 15"/></svg></div>
            <div id="uploadText">Drag &amp; drop or click to upload image</div>
            <div class="hint">Max 5MB (PNG, JPG)</div>
          </div>
        </div>
        <div class="field"><label>Date Lost</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            <input class="with-icon" type="text" id="dateLostInput" placeholder="Pick a date">
          </div>
        </div>
        <div class="field"><label>Preferred Contact Method</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg></span>
            <select class="with-icon" id="contactMethodInput">
              <option value="">Select contact method</option>
              <option>Email</option>
              <option>Phone</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary spaced-top" type="submit">Submit Report</button>
      </form>
    </div>
    <div id="bottomNav"></div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="report-lost.js"></script>
</body>
</html>
