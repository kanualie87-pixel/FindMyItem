<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="topbar">
      <h1>Admin Panel</h1>
      <div class="admin-header-actions">
        <a class="back" href="../profile/profile.html"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
      </div>
    </div>
    <div class="admin-body">
      <div class="admin-card">
        <h3>Pending Reports</h3>
        <div class="search-input-wrap">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input class="with-icon" type="text" placeholder="Search reports...">
        </div>
        <div class="table-scroll">
          <table class="admin-table" id="reportsTable">
            <thead><tr><th>Item Name</th><th>Status</th><th>Reporter</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="admin-card">
        <h3>Manage Users</h3>
        <div class="search-input-wrap">
          <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input class="with-icon" type="text" placeholder="Search users...">
        </div>
        <div id="usersList"></div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="admin.js"></script>
</body>
</html>
