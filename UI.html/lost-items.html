<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Items — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="lost-items.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="topbar">
      <a class="back" href="../home/home.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1>Lost Items</h1>
    </div>
    <div class="list-body">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input class="with-icon" type="text" id="listSearch" placeholder="Search items...">
        </div>
        <button class="icon-btn blue" id="filterToggleBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="4 4 20 4 14 12 14 19 10 21 10 12 4 4"/></svg>
        </button>
      </div>
      <div class="chipbar" id="chipbar"></div>
      <div id="listContainer"></div>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="lost-items.js"></script>
</body>
</html>
