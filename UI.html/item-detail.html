<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Detail — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="item-detail.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="topbar">
      <a class="back" href="lost-items.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1 id="detailTitleBar">Item</h1>
    </div>
    <div class="scroll-panel">
      <div class="detail-hero" id="detailHero"></div>
      <div class="detail-body">
        <div class="detail-title-row">
          <h2 id="detailName">—</h2>
          <span class="badge" id="detailBadge">Lost</span>
        </div>
        <div class="detail-cat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          <span id="detailCat">Category</span>
        </div>
        <h3>Description</h3>
        <p class="desc-text" id="detailDesc">—</p>
        <h3>Reporter Information</h3>
        <div class="reporter-row"><span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></span><span id="detailReporter">John D.</span></div>
        <div class="reporter-row"><span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></span><span id="detailPhone">+1 (XXX) XXX-5678</span></div>
      </div>
    </div>
    <div class="detail-cta" id="detailCtaWrap"></div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="item-detail.js"></script>
</body>
</html>
