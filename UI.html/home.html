<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — FindMyItem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="stage">
  <div class="app-shell">
    <div class="home-top">
      <a class="icon-btn blue" href="../items/lost-items.html" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <div class="right-icons">
        <a class="icon-btn ghost" href="../messages/messages.html" aria-label="Messages">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a class="icon-btn ghost" href="../profile/profile.html" aria-label="Profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </a>
      </div>
    </div>
    <div class="home-body">
      <a class="search-input-wrap static-block" href="../items/lost-items.html">
        <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input class="with-icon" type="text" placeholder="Search for lost items..." readonly>
      </a>
      <div class="home-actions">
        <a class="btn btn-primary" href="../items/report-lost.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Report Lost Item
        </a>
        <a class="btn btn-outline" href="../items/lost-items.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          View Items
        </a>
      </div>
      <h2 class="section-title"><span>Recently Reported</span><span class="count" id="homeCount"></span></h2>
      <div class="card-grid" id="homeGrid"></div>
    </div>
    <div id="bottomNav"></div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="home.js"></script>
</body>
</html>
